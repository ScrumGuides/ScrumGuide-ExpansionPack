# This workflow is managed by gh actions-lock.

name: Azure Static Web App PR Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  close:
    uses: nkdAgility/OpenGuidePlatform/.github/workflows/guide-site-close-pr.yaml@v2.2.0-Preview.1
    with:
      deployment-environment: canary-${{ github.event.pull_request.number }}
    secrets:
      static-web-app-token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_ISLAND_0C966E810 }}
