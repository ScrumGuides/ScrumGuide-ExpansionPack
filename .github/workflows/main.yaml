# This workflow is managed by gh actions-lock.
# Site-owned caller; OGP updates only its release reference.
name: Build & Release (ScrumGuidesExpansionPack)
on:
  push:
    branches: [main]
    tags: ['v[0-9]*', '[0-9]*']
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Build target (deployment remains disabled during adoption)
        type: choice
        options: [auto, preview, canary, production]
        default: auto
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guide-site:
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: nkdAgility/OpenGuidePlatform/.github/workflows/guide-site-build.yaml@v1
    with:
      source-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      source-path: site
      target: ${{ inputs.target || 'auto' }}
      deploy: false
    secrets:
      static-web-app-token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_ISLAND_0C966E810 }}